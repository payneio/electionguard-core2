[package]
name = "electionguard-core2"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "ElectionGuard Core2 cryptographic voting SDK (v2.1 spec)"

[dependencies]
crypto-bigint = { version = "0.6", features = ["rand_core", "zeroize"] }
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }
thiserror = "2"
hex = "0.4"
subtle = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"
rand = "0.8"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"

[[bench]]
name = "group_ops"
harness = false

[[bench]]
name = "encrypt"
harness = false
